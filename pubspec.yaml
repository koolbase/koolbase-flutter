name: koolbase_flutter
description: Flutter SDK for Koolbase — feature flags, remote config, version enforcement, authentication, storage, database, realtime, OTA updates, and code push for mobile apps.
version: 11.4.2
homepage: https://koolbase.com
repository: https://github.com/kennedyowusu/koolbase_flutter
environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

# Declared, not inferred. Koolbase is a MOBILE backend: code push, OTA,
# offline-first and version enforcement are the product, and none of them
# exist in a browser or on a desktop. Browser work belongs to the separate
# JS SDK. Without this block pub.dev guesses, and a developer discovers the
# boundary as a build failure instead of a badge.
platforms:
  android:
  ios:
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  flutter_secure_storage: ">=9.0.0 <11.0.0"
  shared_preferences: ^2.2.0
  archive: ^4.0.9
  path_provider: ^2.1.0
  package_info_plus: ">=8.0.0 <10.0.0"
  crypto: ^3.0.3
  uuid: ^4.4.0
  web_socket_channel: ^3.0.3
  drift: ^2.31.0
  drift_flutter: ^0.2.8
  connectivity_plus: ^7.1.0
  rfw: ^1.0.32
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  drift_dev: ^2.18.0
flutter:
  # No assets or fonts needed for SDK
